name: React Map Explorer Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/map-explorer/**'
      - '.github/workflows/map-explorer-ci.yml'
  pull_request:
    paths:
      - 'apps/map-explorer/**'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/map-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify isolated staging build output
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const base='.cloudflare/output/v0/workers/default/';
            const cfg=JSON.parse(fs.readFileSync(base+'worker.config.json','utf8'));
            const blob=fs.readFileSync(base+'bundle/index.js','utf8');
            if(cfg.name!=='accountabilibuddy-map-staging') throw Error('Wrong Worker target');
            if(cfg.assets?.basePath!=='/map-lab') throw Error('Wrong staging route');
            if(!cfg.assets.runWorkerFirst.includes('/api/*')) throw Error('Missing API isolation');
            if(cfg.env||cfg.bindings||cfg.durable_objects||/PRM|PRIVATE_EVIDENCE/.test(blob)) throw Error('Private binding is forbidden in staging');
            if(!fs.existsSync(base+'assets/index.html')) throw Error('Missing frontend assets');
            console.log('Cloudflare staging configuration passed isolation gate');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: abb-react-map-preview
          path: apps/map-explorer/.cloudflare/output/v0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
